<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Matrimonio</title>
<style>:root {
  --fondo: #f7f1ea; --tarjeta: #fffdfa; --texto: #2b2522; --suave: #6f645d;
  --acento: #8a5a44; --linea: #e4d8cc; --ok: #3f6b4f;
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0; background: var(--fondo); color: var(--texto);
  font-family: Georgia, "Times New Roman", serif; line-height: 1.45;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
.cabecera { text-align: center; padding: 28px 20px 8px; }
.cabecera h1 { margin: 0; font-size: 1.9rem; font-weight: normal; color: var(--acento); }
.cabecera p { margin: 6px 0 0; color: var(--suave); }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px; }
.vista h2 { font-weight: normal; font-size: 1.4rem; margin: 18px 0 10px; }
.tarjeta {
  background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 14px;
  padding: 18px; margin: 12px 0;
}
.grande { font-size: 2.1rem; color: var(--acento); margin: 4px 0; line-height: 1.15; }
.suave { color: var(--suave); }
.saludo { margin: 0; font-size: 1.1rem; }
input[type=search] {
  width: 100%; font: inherit; padding: 14px; border: 1px solid var(--linea);
  border-radius: 12px; background: #fff; color: var(--texto);
}
button { font: inherit; }
.resultado, .boton {
  display: block; width: 100%; text-align: left; font: inherit; color: var(--texto);
  background: #fff; border: 1px solid var(--linea); border-radius: 12px;
  padding: 14px; margin-top: 8px; cursor: pointer;
}
.resultado small { display: block; color: var(--suave); }
.boton.secundario { text-align: center; background: transparent; color: var(--suave); }
.pestanas {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  background: var(--tarjeta); border-top: 1px solid var(--linea);
  padding-bottom: env(safe-area-inset-bottom);
}
.pestanas button {
  flex: 1; padding: 16px 4px; border: 0; background: none; color: var(--suave);
  font-size: .85rem; letter-spacing: .02em;
}
.pestanas button[aria-current=true] { color: var(--acento); font-weight: bold; box-shadow: inset 0 3px 0 var(--acento); }
.plano { width: 100%; border-radius: 12px; border: 1px solid var(--linea); margin-top: 8px; }
.aviso { text-align: center; padding: 28px 12px; }

/* Esquemas */
.plano-svg { width: 100%; height: auto; display: block; }
.s-altar { fill: var(--acento); }
.s-sector { fill: #efe5d9; stroke: var(--linea); stroke-width: 1; }
.s-on, .s-mesa.s-on { fill: var(--acento); stroke: #5e3a2a; stroke-width: 2; }
.s-mesa { fill: #efe5d9; stroke: var(--linea); stroke-width: 1; }
.s-txt { fill: var(--texto); font-size: 13px; font-family: Georgia, serif; }
.s-claro { fill: #fff; }
.s-chico { font-size: 10px; }
.s-titulo { font-size: 13px; fill: var(--suave); }
.nota { font-size: .8rem; color: var(--suave); text-align: center; margin: 4px 0 0; }

/* Bingo */
.bingo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.casilla {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 6px; font: inherit; font-size: .78rem; line-height: 1.2; color: var(--texto);
  background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; cursor: pointer; position: relative;
}
.casilla[aria-pressed=true] { background: var(--ok); color: #fff; border-color: var(--ok); }
.casilla[aria-pressed=true]::after { content: "✓"; position: absolute; top: 4px; right: 8px; font-size: .9rem; }
.estado-bingo { text-align: center; min-height: 1.6em; color: var(--ok); font-weight: bold; }
a.boton.foto, button.boton.foto {
  text-align: center; text-decoration: none; background: var(--acento); color: #fff; border-color: var(--acento);
}
.aviso-foto { text-align: center; color: var(--suave); font-size: .9rem; margin: 6px 0 0; }
</style></head><body>
<header class="cabecera"><h1 id="titulo"></h1><p id="subtitulo"></p></header>
<main><section id="vista-ceremonia" class="vista" hidden></section><section id="vista-cocktel" class="vista" hidden></section><section id="vista-cena" class="vista" hidden></section><section id="vista-fiesta" class="vista" hidden></section></main>
<nav class="pestanas"><button data-vista="ceremonia">Ceremonia</button><button data-vista="cocktel">Cóctel</button><button data-vista="cena">Cena</button><button data-vista="fiesta">Fiesta</button></nav>
<script>
const DATOS = {"inv":[{"nombre":"María José Pérez","n":"maria jose perez","lado":"Novia","sector":"A","asiste_fiesta":1,"mesa_nombre":"Mesa 1","mesa_codigo":"KJX65J"},{"nombre":"Juan Pérez Soto","n":"juan perez soto","lado":"Novia","sector":"A","asiste_fiesta":1,"mesa_nombre":"Mesa 1","mesa_codigo":"KJX65J"},{"nombre":"Carolina Soto","n":"carolina soto","lado":"Novia","sector":"A","asiste_fiesta":1,"mesa_nombre":"Mesa 1","mesa_codigo":"KJX65J"},{"nombre":"Andrés Muñoz","n":"andres munoz","lado":"Novio","sector":"B","asiste_fiesta":1,"mesa_nombre":"Mesa 2","mesa_codigo":"UU2RXU"},{"nombre":"Valentina Rojas","n":"valentina rojas","lado":"Novio","sector":"B","asiste_fiesta":1,"mesa_nombre":"Mesa 2","mesa_codigo":"UU2RXU"},{"nombre":"Sebastián González","n":"sebastian gonzalez","lado":"Novio","sector":"A","asiste_fiesta":1,"mesa_nombre":"Mesa 3","mesa_codigo":"B96EVY"},{"nombre":"Isabel Ibáñez","n":"isabel ibanez","lado":"Novio","sector":"A","asiste_fiesta":1,"mesa_nombre":"Mesa 3","mesa_codigo":"B96EVY"},{"nombre":"Tomás Correa","n":"tomas correa","lado":"Novia","sector":"C","asiste_fiesta":0,"mesa_nombre":"Mesa 4","mesa_codigo":"2PCGFX"},{"nombre":"Francisca Núñez","n":"francisca nunez","lado":"Novia","sector":"C","asiste_fiesta":1,"mesa_nombre":"Mesa 4","mesa_codigo":"2PCGFX"},{"nombre":"Pedro Araya","n":"pedro araya","lado":"Novio","sector":"C","asiste_fiesta":1,"mesa_nombre":null,"mesa_codigo":null}],"mesas":{"KJX65J":"Mesa 1","UU2RXU":"Mesa 2","B96EVY":"Mesa 3","2PCGFX":"Mesa 4"}};
const _resp = (d, s=200) => new Response(JSON.stringify(d), {status:s, headers:{"content-type":"application/json"}});
window.fetch = async (url) => {
  const u = new URL(url, "http://x");
  if (u.pathname === "/api/buscar") {
    const q = u.searchParams.get("q") || "";
    const w = q.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").trim().split(/\s+/).filter(Boolean).slice(0,4);
    if (w.join("").length < 3) return _resp({resultados:[]});
    const r = DATOS.inv.filter(i => w.every(p => i.n.includes(p))).slice(0,6).map(({n,...x})=>x);
    return _resp({resultados:r});
  }
  if (u.pathname === "/api/mesa") {
    const c = (u.searchParams.get("c")||"").toUpperCase();
    return DATOS.mesas[c] ? _resp({mesa:{nombre:DATOS.mesas[c], codigo:c}}) : _resp({error:"no existe"},404);
  }
  if (u.pathname === "/api/mesas") return _resp({mesas:Object.values(DATOS.mesas).map(nombre=>({nombre}))});
  return _resp({error:"?"},404);
};</script><script>// Textos, link de fotos y consignas del bingo. Edita aquí sin tocar el resto del código.
window.CONFIG = {
  titulo: "Nuestro matrimonio",
  subtitulo: "Encuentra tu lugar y comparte tus fotos",

  // Link para subir fotos. Mientras esté vacío, el botón avisa que llegará pronto.
  fotosUrl: "",

  // Sectores de la ceremonia, de adelante hacia atrás (en cada lado: Novia / Novio).
  sectores: ["A", "B", "C"],

  // Planos reales opcionales (déjalos en public/planos/). null = no se muestra.
  planos: { ceremonia: null, cena: null },

  // Consignas del bingo (9 casillas por mesa, elegidas al azar según la mesa).
  bingo: {
    cena: [
      "Selfie de toda la mesa", "Foto con los novios", "Brindis con tu mesa",
      "El plato que más te gustó", "Alguien riendo a carcajadas", "La decoración de tu mesa",
      "Foto con alguien de otra mesa", "Los zapatos más elegantes", "El postre",
      "Un abrazo entre dos de tu mesa", "Foto con la persona más joven de tu mesa", "Tu mesa haciendo cheers",
      "La mejor pose de tu mesa", "Alguien emocionado", "Foto con un familiar de los novios",
    ],
    fiesta: [
      "Baile en ronda", "Selfie en la pista", "Foto con los novios bailando",
      "Alguien cantando a todo pulmón", "Tu mejor paso de baile", "Abrazo grupal",
      "Foto con alguien que no veías hace años", "Trencito de baile", "Brindis en la pista",
      "El más animado de la fiesta", "Foto con los novios y tu mesa", "Alguien bailando con los zapatos en la mano",
      "Pose de película con amigos", "Los novios en el centro de la pista", "Selfie con el cielo o las luces",
    ],
  },
};
</script><script>(() => {
  const VISTAS = ["ceremonia", "cocktel", "cena", "fiesta"];
  const CLAVE = "matrimonio:v1";
  const cfg = window.CONFIG;

  // Estado recordado en este celular: { invitado, mesa }
  let estado = leer();
  function leer() { try { return JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch { return {}; } }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch {} }

  const $ = (s) => document.querySelector(s);
  function el(tag, props = {}, ...hijos) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const h of hijos) n.append(h);
    return n;
  }

  // ---------- buscador ----------
  function buscador(alElegir) {
    const entrada = el("input", { type: "search", placeholder: "Escribe tu nombre o apellido", autocomplete: "off", "aria-label": "Buscar mi nombre" });
    const lista = el("div");
    let temporizador, ultima = 0;
    entrada.addEventListener("input", () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(async () => {
        const q = entrada.value.trim();
        lista.replaceChildren();
        if (q.replace(/\s/g, "").length < 3) return;
        const id = ++ultima;
        try {
          const r = await fetch("/api/buscar?q=" + encodeURIComponent(q));
          const { resultados } = await r.json();
          if (id !== ultima) return;
          if (!resultados.length) { lista.append(el("p", { class: "suave" }, "No encontramos ese nombre. Prueba con otro apellido.")); return; }
          for (const x of resultados) {
            lista.append(el("button", { class: "resultado", onclick: () => alElegir(x) }, x.nombre, el("small", {}, "Toca si eres tú")));
          }
        } catch { lista.append(el("p", { class: "suave" }, "No pudimos buscar ahora. Revisa tu conexión.")); }
      }, 300);
    });
    return el("div", { class: "tarjeta" }, el("p", { class: "saludo" }, "Busca tu nombre para ver tu ubicación"), entrada, lista);
  }

  function elegir(x) {
    estado.invitado = { nombre: x.nombre, lado: x.lado, sector: x.sector, mesa: x.mesa_nombre, fiesta: !!x.asiste_fiesta };
    if (x.mesa_codigo) estado.mesa = { codigo: x.mesa_codigo, nombre: x.mesa_nombre };
    guardar(); pintar();
  }
  function olvidar() { delete estado.invitado; delete estado.mesa; guardar(); pintar(); }
  const cambiar = () => el("button", { class: "boton secundario", onclick: olvidar }, "No soy yo / buscar otro nombre");

  function plano(ruta) { return ruta ? el("img", { class: "plano", src: ruta, alt: "Plano" }) : ""; }
  const norm = (x) => String(x || "").trim().toLowerCase();

  // ---------- esquemas (SVG) ----------
  const NS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs = {}, ...hijos) {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    for (const h of hijos) n.append(h);
    return n;
  }

  function planoCeremonia(i) {
    const sec = cfg.sectores, alto = 52, sep = 8, y0 = 70;
    const H = y0 + sec.length * (alto + sep) + 40;
    const s = svg("svg", { viewBox: `0 0 320 ${H}`, class: "plano-svg", role: "img", "aria-label": "Esquema de la ceremonia" });
    s.append(svg("rect", { x: 105, y: 10, width: 110, height: 30, rx: 6, class: "s-altar" }),
             svg("text", { x: 160, y: 30, "text-anchor": "middle", class: "s-txt s-claro" }, "Altar"));
    for (const [lado, x] of [["Novia", 20], ["Novio", 180]]) {
      s.append(svg("text", { x: x + 60, y: 60, "text-anchor": "middle", class: "s-txt s-titulo" }, lado));
      sec.forEach((letra, k) => {
        const y = y0 + k * (alto + sep);
        const on = i && norm(i.lado) === norm(lado) && norm(i.sector) === norm(letra);
        s.append(svg("rect", { x, y, width: 120, height: alto, rx: 8, class: on ? "s-sector s-on" : "s-sector" }),
                 svg("text", { x: x + 60, y: y + (on ? 24 : 31), "text-anchor": "middle", class: on ? "s-txt s-claro" : "s-txt" }, "Sector " + letra));
        if (on) s.append(svg("text", { x: x + 60, y: y + 41, "text-anchor": "middle", class: "s-txt s-claro s-chico" }, "Tú estás aquí"));
      });
    }
    s.append(svg("text", { x: 160, y: H - 10, "text-anchor": "middle", class: "s-txt s-titulo" }, "Entrada"));
    return el("div", { class: "tarjeta" }, s, el("p", { class: "nota" }, "Esquema referencial, no está a escala."));
  }

  function planoMesas(nombres, mia) {
    const cols = 4, dy = 84, filas = Math.ceil(nombres.length / cols);
    const s = svg("svg", { viewBox: `0 0 320 ${filas * dy + 16}`, class: "plano-svg", role: "img", "aria-label": "Esquema de mesas" });
    nombres.forEach((nombre, k) => {
      const cx = 40 + (k % cols) * 80, cy = 38 + Math.floor(k / cols) * dy, on = mia && nombre === mia;
      s.append(svg("circle", { cx, cy, r: 28, class: on ? "s-mesa s-on" : "s-mesa" }),
               svg("text", { x: cx, y: cy + 5, "text-anchor": "middle", class: on ? "s-txt s-claro" : "s-txt" }, nombre.replace(/^mesa\s*/i, "")));
      if (on) s.append(svg("text", { x: cx, y: cy + 46, "text-anchor": "middle", class: "s-txt s-chico" }, "Tu mesa"));
    });
    return el("div", { class: "tarjeta" }, el("div", { class: "suave" }, "Mesas de la cena"), s, el("p", { class: "nota" }, "Esquema referencial, no está a escala."));
  }

  // ---------- botón de fotos ----------
  function botonFotos() {
    if (cfg.fotosUrl) return el("a", { class: "boton foto", href: cfg.fotosUrl, target: "_blank", rel: "noopener" }, "Subir fotos");
    const aviso = el("p", { class: "aviso-foto" });
    const b = el("button", { class: "boton foto", onclick: () => { aviso.textContent = "El link para subir fotos estará disponible muy pronto."; } }, "Subir fotos");
    return el("div", {}, b, aviso);
  }

  // ---------- bingo ----------
  function xmur3(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; }; }
  function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const LINEAS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function bingo(momento) {
    const clave = (estado.mesa ? estado.mesa.codigo : "general") + ":" + momento;
    const azar = mulberry32(xmur3(clave)());
    const banco = [...cfg.bingo[momento]];
    for (let k = banco.length - 1; k > 0; k--) { const j = Math.floor(azar() * (k + 1)); [banco[k], banco[j]] = [banco[j], banco[k]]; }
    const casillas = banco.slice(0, 9);
    estado.bingo = estado.bingo || {};
    const marcadas = new Set(estado.bingo[clave] || []);
    const estadoTxt = el("p", { class: "estado-bingo" });
    const botones = casillas.map((texto, k) => el("button", { class: "casilla", "aria-pressed": String(marcadas.has(k)), onclick: () => {
      marcadas.has(k) ? marcadas.delete(k) : marcadas.add(k);
      botones[k].setAttribute("aria-pressed", String(marcadas.has(k)));
      estado.bingo[clave] = [...marcadas]; guardar(); revisar();
    } }, texto));
    function revisar() {
      const lineas = LINEAS.filter((l) => l.every((k) => marcadas.has(k))).length;
      estadoTxt.textContent = marcadas.size === 9 ? "¡Tablero completo! Avísales a los novios." : lineas ? (lineas === 1 ? "¡Línea completa!" : `¡${lineas} líneas completas!`) : "";
    }
    revisar();
    return el("div", {}, el("div", { class: "bingo" }, ...botones), estadoTxt);
  }

  // ---------- vistas ----------
  function vistaCeremonia(c) {
    c.append(el("h2", {}, "Ceremonia"));
    const i = estado.invitado;
    if (!i) { c.append(buscador(elegir), planoCeremonia(null), plano(cfg.planos.ceremonia), botonFotos()); return; }
    c.append(el("p", { class: "saludo" }, "Hola, " + i.nombre));
    if (i.lado || i.sector) {
      c.append(el("div", { class: "tarjeta" },
        el("div", { class: "suave" }, "Tu lugar en la ceremonia"),
        el("div", { class: "grande" }, [i.lado && "Lado " + i.lado, i.sector && "Sector " + i.sector].filter(Boolean).join(" · "))));
    } else {
      c.append(el("div", { class: "tarjeta" }, "Aún no tenemos un lugar asignado para ti en la ceremonia. Siéntate donde prefieras."));
    }
    c.append(planoCeremonia(i), plano(cfg.planos.ceremonia), botonFotos(), cambiar());
  }

  function vistaCocktel(c) {
    c.append(el("h2", {}, "Cóctel"));
    const i = estado.invitado, m = estado.mesa;
    if (!i && !m) c.append(buscador(elegir));
    if (i) c.append(el("p", { class: "saludo" }, "Hola, " + i.nombre));
    if (m) {
      c.append(el("div", { class: "tarjeta" },
        el("div", { class: "suave" }, "Tu mesa en la cena"),
        el("div", { class: "grande" }, m.nombre)));
    } else if (i) {
      c.append(el("div", { class: "tarjeta" }, i.fiesta ? "No tienes mesa en la cena. ¡Te esperamos en la fiesta!" : "Aún no tenemos una mesa asignada para ti."));
    }
    const hueco = el("div");
    c.append(hueco, plano(cfg.planos.cena), botonFotos());
    if (i) c.append(cambiar());
    fetch("/api/mesas").then((r) => r.json()).then(({ mesas }) => {
      const nombres = mesas.map((x) => x.nombre).sort((a, b) => a.localeCompare(b, "es", { numeric: true }));
      if (nombres.length) hueco.replaceChildren(planoMesas(nombres, m && m.nombre));
    }).catch(() => {});
  }

  function vistaBingo(c, momento, titulo, intro) {
    c.append(el("h2", {}, titulo), el("p", { class: "suave" }, intro));
    if (estado.mesa) c.append(el("p", { class: "saludo" }, "Bingo de " + estado.mesa.nombre));
    else c.append(el("p", { class: "nota" }, "Busca tu nombre en Ceremonia o Cóctel para tener el tablero de tu mesa."));
    c.append(bingo(momento), botonFotos());
  }

  const PINTAR = {
    ceremonia: vistaCeremonia,
    cocktel: vistaCocktel,
    cena: (c) => vistaBingo(c, "cena", "Cena", "Toca cada casilla cuando saques esa foto con tu mesa."),
    fiesta: (c) => vistaBingo(c, "fiesta", "Fiesta", "Toca cada casilla cuando saques esa foto en la pista."),
  };

  // ---------- navegación ----------
  function actual() { const h = location.hash.slice(1); return VISTAS.includes(h) ? h : "ceremonia"; }
  function pintar() {
    const v = actual();
    for (const id of VISTAS) {
      const s = $("#vista-" + id);
      s.hidden = id !== v;
      if (id === v) { s.replaceChildren(); PINTAR[id](s); }
    }
    document.querySelectorAll(".pestanas button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.vista === v)));
  }

  async function iniciar() {
    $("#titulo").textContent = cfg.titulo;
    $("#subtitulo").textContent = cfg.subtitulo;
    document.title = cfg.titulo;
    document.querySelectorAll(".pestanas button").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.vista; }));
    window.addEventListener("hashchange", pintar);

    // QR de mesa: /?mesa=CODIGO
    const codigo = new URLSearchParams(location.search).get("mesa");
    if (codigo) {
      try {
        const r = await fetch("/api/mesa?c=" + encodeURIComponent(codigo));
        if (r.ok) { estado.mesa = (await r.json()).mesa; guardar(); if (!location.hash) location.hash = "cocktel"; }
      } catch {}
      history.replaceState(null, "", location.pathname + location.hash);
    }
    pintar();
  }
  iniciar();
})();
</script></body></html>
